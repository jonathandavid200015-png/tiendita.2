<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiendita">
<title>La Tiendita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (Design System "La Tiendita") ===== */
:root{
  --surface-100:#fbf7f2; --surface-200:#ffffff; --surface-300:#f1e9df; --line:#e8ddd0;
  --ink:#2b1d14; --ink-muted:#6b5a4c;
  --brand:#8b4f2a; --on-brand:#ffffff; --brand-soft:#f3e3d6; --brand-text:#7a4322;
  --gain:#2e7d4f; --gain-fill:#3f9d66; --gain-soft:#e0f0e5;
  --accent:#e08a1e; --on-accent:#2b1d14; --accent-soft:#fdecd3; --accent-text:#9a5600;
  --danger:#b83a26; --danger-soft:#fbe3dc;
  --shadow:0 1px 2px rgba(43,29,20,.05),0 6px 20px rgba(139,79,42,.07);
  --chart-in:#2f8a58; --chart-due:#d9821a; --chart-neutral:#cdbba8; --age-1:#e8b04a; --age-2:#d9821a; --age-3:#b83a26;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;
  --radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-pill:999px;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface-100:#17120e;--surface-200:#211a15;--surface-300:#2e251e;--line:#3a2f26;
  --ink:#f6efe7;--ink-muted:#bcae9f;
  --brand:#e0a374;--on-brand:#24160c;--brand-soft:#3d2a1c;--brand-text:#e8b48a;
  --gain:#5fd394;--gain-fill:#3fb06e;--gain-soft:#183022;
  --accent:#f2a54a;--on-accent:#241505;--accent-soft:#3b2a13;--accent-text:#f5b566;
  --danger:#f08a7a;--danger-soft:#3b201b;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark;
  --chart-in:#3aa36a;--chart-due:#c97a22;--chart-neutral:#5b4b3f;--age-1:#a8823a;--age-2:#c97a22;--age-3:#e0705e;}

*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--surface-100);color:var(--ink);font-family:var(--font);font-size:15px;line-height:22px;font-weight:500;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button,.sell,[data-a]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;line-height:20px;font-weight:700}
.eyebrow{font-size:12px;line-height:16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.muted{color:var(--ink-muted)} .small{font-size:13px;line-height:18px}
.pos{color:var(--gain)} .warn{color:var(--accent-text)} .neg{color:var(--danger)}

/* ===== Layout ===== */
.app{display:flex;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 8px;background:color-mix(in srgb,var(--surface-100) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.wrap{max-width:1080px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-200);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--ink-muted);border-radius:12px}
.bottomnav button.on{color:var(--brand-text)}
.bottomnav button.on .pill{background:var(--brand-soft)}
.bottomnav .pill{padding:3px 16px;border-radius:var(--radius-pill);display:grid;place-items:center}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:240px;flex:none;position:sticky;top:0;height:100dvh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface-200)}
  .side .brandmark{padding:4px 8px 20px}
  .side nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink-muted)}
  .side nav button:hover{background:var(--surface-300);color:var(--ink)}
  .side nav button.on{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
  .side .foot{margin-top:auto}
  .bottomnav{display:none}
  .topbar .brandmark{visibility:hidden}
  .main{padding:0 32px 48px}
  .topbar{margin:0 -32px 8px;padding:16px 32px 12px}
}

/* ===== Components ===== */
.card{background:var(--surface-200);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi .val{font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.brand{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.kpi.brand .eyebrow,.kpi.brand .muted{color:inherit;opacity:.85}
.kpi.accent{background:var(--accent-soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-pill);font-weight:700;background:var(--surface-300);color:var(--ink);white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-muted)}
.iconbtn:hover{background:var(--surface-300);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-300);border-radius:var(--radius-pill);padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:8px 16px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;color:var(--ink-muted);white-space:nowrap}
.seg button.on{background:var(--surface-200);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;line-height:20px;background:var(--surface-300);color:var(--ink-muted);white-space:nowrap}
.chip.ok{background:var(--gain-soft);color:var(--gain)}
.chip.warn{background:var(--accent-soft);color:var(--accent-text)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.empty{text-align:center;padding:32px 16px}
.empty .big{width:56px;height:56px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text)}
.section-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 -4px}
.pagehead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin:4px 0 4px}

/* product cards */
.pgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.prod .name{font-weight:800;font-size:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv div{background:var(--surface-100);border-radius:var(--radius-sm);padding:8px 10px}
.kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--ink-muted);font-weight:600}

/* sell */
.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.sgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.sell{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;cursor:pointer;transition:border-color .12s}
.sell.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.sell .price{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface-100);border-radius:var(--radius-pill);padding:3px;margin-top:4px}
.stepper button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-200);color:var(--ink)}
.stepper button.plus{background:var(--brand);color:var(--on-brand)}
.stepper b{font-variant-numeric:tabular-nums;font-size:16px}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:var(--surface-100);border-radius:var(--radius-lg);padding:12px 12px 12px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cartbar .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.cartbar .btn{min-height:42px}
.cartbar .btn.ghost{border-color:color-mix(in srgb,var(--surface-100) 30%,transparent);color:var(--surface-100)}
@media (min-width:900px){.cartbar{left:272px;right:32px;bottom:20px;max-width:1016px;margin:0 auto}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:700;color:var(--ink-muted)}
.input,.field input,.field select,select.input{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface-100);outline:none;font-weight:600;font-size:16px}
.field input:focus,.input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--ink-muted);line-height:16px}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc div{background:var(--gain-soft);border-radius:var(--radius-md);padding:10px;text-align:center}
.calc b{display:block;font-size:17px;color:var(--gain);font-variant-numeric:tabular-nums}
.calc span{font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em}
.calc .bad{background:var(--danger-soft)} .calc .bad b{color:var(--danger)}
.sugbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface-100);border:1px dashed var(--line);border-radius:var(--radius-md);padding:10px 12px;font-size:13px;font-weight:600}
.sugbox input{font-size:16px;width:64px;min-height:34px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-200);text-align:center;font-weight:700}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,11,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface-200);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;padding:24px}}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--surface-100);padding:10px 18px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s;max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:32px}}

/* bars & tables */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;margin-bottom:4px}
.bar .track{height:12px;border-radius:var(--radius-pill);background:var(--surface-300);overflow:hidden}
.bar .fill{height:100%;border-radius:var(--radius-pill);background:var(--gain-fill)}
.bar .fill.cli{background:var(--brand)}
.bar .fill.acc{background:var(--accent)}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);text-align:right;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:800;border-bottom:0}
.qty{width:76px;min-height:40px;font-size:16px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface-100);font-weight:800}
.star{display:flex;gap:12px;align-items:center}
.star .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
details.client{border-top:1px solid var(--line)}
details.client:first-of-type{border-top:0}
details.client summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer}
details.client summary::-webkit-details-marker{display:none}
details.client .body{padding:0 0 14px 50px;display:flex;flex-direction:column;gap:8px}
@media (max-width:520px){details.client .body{padding-left:0}}
.vrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surface-100);border-radius:var(--radius-md);padding:10px 12px}
.payday{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:var(--radius-lg);padding:14px 16px}
.payday .d{font-size:28px;font-weight:800;color:var(--accent-text);line-height:1;font-variant-numeric:tabular-nums}
.profit{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding:10px 12px;border-radius:var(--radius-md);background:var(--gain-soft)}
.profit b{font-size:22px;font-weight:800;color:var(--gain);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.profit span{font-size:13px;font-weight:600;color:var(--ink-muted)}
.profit.bad{background:var(--danger-soft)} .profit.bad b{color:var(--danger)}
.unitcost{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:14px 16px;border-radius:var(--radius-md);background:var(--ink);color:var(--surface-100)}
.unitcost span{font-weight:700;font-size:14px}
.unitcost b{grid-row:span 2;font-size:26px;font-weight:800;letter-spacing:-.02em}
.unitcost small{font-size:12px;opacity:.7}
.verdict{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius-md);background:var(--gain-soft)}
.verdict>p:first-child{font-size:15px}
.verdict.bad{background:var(--danger-soft)} .verdict.bad b{color:var(--danger)}
.verdict .calc div{background:var(--surface-200)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-muted)}
.search input{padding-left:42px}
.bottomnav button[data-v=vender] .pill{background:var(--brand);color:var(--on-brand)}
.bottomnav button[data-v=vender].on .pill{background:var(--brand)}
.toast button{margin-left:12px;color:var(--accent);font-weight:800;text-decoration:underline}
.clickable{cursor:pointer}
.clickable:hover{background:color-mix(in srgb,var(--surface-300) 45%,transparent)}
.list .li.clickable{margin:0 -16px;padding-left:16px;padding-right:12px}
.chev{color:var(--ink-muted);font-size:22px;line-height:1;margin-left:-4px}
.avatar.xl{width:56px;height:56px;font-size:20px}
.saldo{border-radius:var(--radius-lg);padding:18px 20px}
.saldo .big{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.saldo.debe{background:var(--accent-soft)} .saldo.debe .big{color:var(--accent-text)}
.saldo.ok{background:var(--gain-soft)} .saldo.ok .big{color:var(--gain)}
.saldo .eyebrow{color:var(--ink-muted)}
.mov-ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-300);color:var(--ink-muted)}
.mov-ico.cargo{background:var(--accent-soft);color:var(--accent-text)}
.mov-ico.pago{background:var(--gain-soft);color:var(--gain)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipsel input{position:absolute;opacity:0;pointer-events:none}
.chipsel span{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:var(--radius-pill);border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;background:var(--surface-100)}
.chipsel input:checked+span{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chipsel input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.big-input{font-size:24px!important;font-weight:800!important;min-height:56px!important}
.resultado{min-height:22px;font-size:15px;text-align:center}
.big-ok{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--gain-soft);color:var(--gain)}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
@media (max-width:440px){.grid2.one-m{grid-template-columns:1fr}}
input[type=datetime-local]{min-width:0;max-width:100%}
.para{display:flex;align-items:center;gap:12px;background:var(--brand-soft);border-radius:var(--radius-lg);padding:10px 12px;margin-top:-6px}
.picklist{display:flex;flex-direction:column;max-height:46dvh;overflow:auto;margin:0 -6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);min-height:56px}
.pick:last-of-type{border-bottom:0}
.pick:hover,.pick:focus-visible{background:var(--surface-300)}
.pick-t{flex:1;min-width:0;display:flex;flex-direction:column}
.pick-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.quien .nm{font-size:26px;line-height:30px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.qnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface-200);border:1px solid var(--line);border-radius:var(--radius-pill);padding:4px}
.qnav .iconbtn{font-size:26px;line-height:1;border-radius:50%}
.qnav .iconbtn[disabled]{opacity:.3;pointer-events:none}
.qnav .qn{text-align:center;display:flex;flex-direction:column}
.qnav .qn b{font-size:17px}
.rsec h2{margin-bottom:2px}
.kpi-s{background:var(--surface-100);border-radius:var(--radius-md);padding:12px}
.kpi-s .val{font-size:20px;line-height:26px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.kpi-s.hl-in{background:var(--gain-soft)} .kpi-s.hl-due{background:var(--accent-soft)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;font-weight:600;color:var(--ink-muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

.pbar>div{height:100%;background:var(--chart-in);border-radius:var(--radius-pill)}
.msg{padding:10px 12px;border-radius:var(--radius-md);background:var(--accent-soft)}
.msg.ok{background:var(--gain-soft)}
.aging{display:grid;gap:10px;margin-top:10px}
.ag{display:grid;grid-template-columns:1fr;gap:4px}
.ag .track{height:12px;border-radius:var(--radius-pill);background:var(--surface-300);overflow:hidden}
.ag .fill{height:100%;border-radius:var(--radius-pill)}
.fill.b1{background:var(--age-1)} .fill.b2{background:var(--age-2)} .fill.b3{background:var(--age-3)}
.delta{font-size:12px;font-weight:800;padding:2px 8px;border-radius:var(--radius-pill);background:var(--surface-300);color:var(--ink-muted);justify-self:end}
.delta.up{background:var(--gain-soft);color:var(--gain)} .delta.down{background:var(--danger-soft);color:var(--danger)}
.cmp{display:grid;gap:0;margin-top:8px}
.cmp-r{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l d" "v d" "a d";padding:10px 0;border-top:1px solid var(--line);align-items:center}
.cmp-r:first-child{border-top:0}
.cmp-r>span:first-child{grid-area:l}.cmp-r>b{grid-area:v;font-size:18px}.cmp-r>span:nth-child(3){grid-area:a}.cmp-r>.delta{grid-area:d}
@media (min-width:700px){.cmp{grid-template-columns:repeat(5,1fr);gap:12px}.cmp-r{border-top:0;grid-template-columns:1fr;grid-template-areas:"l" "v" "a" "d";background:var(--surface-100);border-radius:var(--radius-md);padding:12px;gap:2px}.cmp-r>.delta{justify-self:start;margin-top:4px}}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .axl{stroke:var(--line);stroke-width:1.5}
.chart .medl{stroke:var(--ink-muted);stroke-width:1;stroke-dasharray:4 4;opacity:.6}
.chart .qz{fill:var(--gain-soft);opacity:.6}
.chart .b-ven{fill:var(--chart-neutral)} .chart .b-gan{fill:var(--chart-in)}
.chart rect:hover,.chart circle:hover{opacity:.8}
.chart .xlab{font-size:11px;fill:var(--ink-muted);font-family:var(--font);font-weight:600}
.chart .xlab.cur{fill:var(--ink);font-weight:800}
.chart .vlab{font-size:11px;fill:var(--ink);font-weight:800;font-family:var(--font)}

.chart .dot{fill:var(--brand);stroke:var(--surface-200);stroke-width:2}
.chart .dlab{font-size:12px;fill:var(--ink);font-weight:700;font-family:var(--font);paint-order:stroke;stroke:var(--surface-200);stroke-width:3px}
.quads{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media (min-width:700px){.quads{grid-template-columns:1fr 1fr}}
.quad{border-radius:var(--radius-md);padding:12px;background:var(--surface-100);border-left:0}
.quad ul{margin:6px 0 0;padding-left:18px;font-weight:600;font-size:14px}
.quad.q-estrella{background:var(--gain-soft)} .quad.q-popular{background:var(--accent-soft)}
.printonly{display:none}
@media print{
  :root,:root[data-theme]{--surface-100:#fff;--surface-200:#fff;--surface-300:#eee;--line:#ccc;--ink:#000;--ink-muted:#444;--gain:#1d6b3f;--gain-soft:#eaf5ee;--accent-soft:#fdf1df;--accent-text:#7a4600;--brand:#6b3a1c;--chart-in:#2f8a58;--chart-due:#d9821a;--chart-neutral:#bfae9c;color-scheme:light}
  html,body{background:#fff!important}
  .side,.bottomnav,.topbar,.cartbar,.toast,.noprint,#scrim,.btn,.iconbtn{display:none!important}
  .main{padding:0!important}.printonly{display:block;margin-bottom:8px}
  .card{box-shadow:none!important;break-inside:avoid;border-color:#ccc}
  .stack{gap:10px}
  .li.clickable{margin:0!important}
}
.hide-m{display:none}
@media (min-width:700px){.hide-m{display:initial}}
</style>

<body>
<div class="app" id="app"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<script>
/* ===================== Utilidades ===================== */
const KEY='tiendita.v1';
const $=s=>document.querySelector(s);
const NF=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const fmt=n=>NF.format(Math.round(n||0)).replace(/\s/g,'\u00a0');
const fmtC=n=>{const r=Math.round((n||0)*100)/100;return Number.isInteger(r)?fmt(r):new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0,maximumFractionDigits:2}).format(r).replace(/\s/g,'\u00a0')};
const fmtN=n=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:1}).format(n||0);
const pct=n=>isFinite(n)?(n*100).toFixed(1).replace('.',',')+' %':'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fFecha=iso=>{const d=new Date(iso);return `${d.getDate()} ${MES[d.getMonth()]}`};
const fHora=iso=>{const d=new Date(iso);return d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})};
const iniciales=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>Array.from(x)[0]||'').join('').toUpperCase()||'?';
const money=v=>parseInt(String(v??'').replace(/\D/g,''),10)||0;
const fmtIn=n=>n?new Intl.NumberFormat('es-CO',{maximumFractionDigits:0}).format(Math.round(n)):'';
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};

const ICON={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/>',
 box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
 book:'<path d="M5 3h13a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5z"/><path d="M9 3v18M12.5 8h3.5M12.5 12h3.5"/>',
 chart:'<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 chat:'<path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.2-4.4A9 9 0 1 1 21 12z"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
 check:'<path d="m5 12 5 5L20 7"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
 truck:'<path d="M2 6h12v10H2zM14 10h4l4 3.5V16h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 down:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>', up:'<path d="M12 15V3M7 8l5-5 5 5M4 21h16"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 21h8M9 17h6v4H9z"/>',
 fire:'<path d="M12 22a7 7 0 0 0 7-7c0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-3 3-5 5-5 8a7 7 0 0 0 7 7z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 cake:'<path d="M5 12h14l-1.6 8.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8z"/><path d="M4 12a8 8 0 0 1 16 0M9 12v9M15 12v9M12 3.5v1"/>',
 alert:'<path d="M12 3 2 20h20zM12 10v4M12 17v.5"/>', cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ===================== Datos ===================== */
function vacio(){return{v:2,config:{nombre:'La Tiendita',tema:'light'},productos:[],clientes:[],ventas:[],compras:[],pagos:[]}}
const MIS_PRODUCTOS=['Torta de queso','Vaso copa dulce de leche combinado','Panelita con leche cortada','Panelita cortada con coco','Vaso galleta con dulce de leche','Galleta rizada domo','Liberales domo'];
function inicial(){const d=vacio();MIS_PRODUCTOS.forEach(n=>d.productos.push({id:uid(),nombre:n,caja:0,uxc:0,costo:0,precio:0,stock:0,minimo:3}));return d}
let D;
try{D=JSON.parse(localStorage.getItem(KEY));if(!D||typeof D!=='object'||Array.isArray(D))D=inicial()}catch(e){D=inicial()}
['productos','clientes','ventas','compras'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});
function normalizar(){
  ['productos','clientes','ventas','compras','pagos'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});
  /* Migración v1 → v2: el estado 'pagado' de cada venta pasa a ser un registro de pago con fecha y hora */
  D.ventas.forEach(v=>{if(v.tipo)return;
    const contado=!v.clienteId||(v.pagado&&(!v.fechaPago||v.fechaPago===v.fecha));
    v.tipo=contado?'contado':'fiado';
    if(!contado&&v.pagado)D.pagos.push({id:uid(),clienteId:v.clienteId,fecha:v.fechaPago||v.fecha,monto:totV(v),medio:'Efectivo',nota:'Registrado antes de la actualización'});
    delete v.pagado;delete v.fechaPago});
  D.v=2;
  D.productos.forEach(p=>{if(p.uxc===undefined){p.uxc=1;p.caja=p.costo||0}p.costo=p.uxc?(p.caja||0)/p.uxc:0})}
D.config=Object.assign({nombre:'La Tiendita',tema:'light'},D.config||{});
if(D.config.tema!=='dark')D.config.tema='light';
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se pudo guardar en este navegador')}}

const prod=id=>D.productos.find(p=>p.id===id);
const cli=id=>D.clientes.find(c=>c.id===id);
const totV=v=>v.items.reduce((a,i)=>a+i.cant*i.precio,0);
const cosV=v=>v.items.reduce((a,i)=>a+i.cant*i.costo,0);
normalizar();

/* Quincenas: 1–15 y 16–fin de mes */
function quincena(d=new Date()){
  const y=d.getFullYear(),m=d.getMonth(),ult=new Date(y,m+1,0).getDate();
  if(d.getDate()<=15) return{ini:new Date(y,m,1),fin:new Date(y,m,15,23,59,59,999),label:`1–15 ${MES[m]}`,pago:new Date(y,m,15)};
  return{ini:new Date(y,m,16),fin:new Date(y,m,ult,23,59,59,999),label:`16–${ult} ${MES[m]}`,pago:new Date(y,m,ult)};
}
function rango(p){
  const q=quincena();
  if(p==='q')return q;
  if(p==='qa')return quincena(new Date(q.ini.getTime()-864e5));
  if(p==='m'){const d=new Date();return{ini:new Date(d.getFullYear(),d.getMonth(),1),fin:new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999),label:MESL[d.getMonth()]}}
  return{ini:new Date(0),fin:new Date(8.64e15),label:'todo el tiempo'};
}
const ventasEn=r=>D.ventas.filter(v=>{const t=new Date(v.fecha);return t>=r.ini&&t<=r.fin});
function statsProd(ventas){
  const m={};
  D.productos.forEach(p=>m[p.id]={id:p.id,nombre:p.nombre,unid:0,ing:0,cos:0});
  ventas.forEach(v=>v.items.forEach(i=>{
    const s=m[i.productoId]||(m[i.productoId]={id:i.productoId,nombre:i.nombre,unid:0,ing:0,cos:0});
    s.unid+=i.cant;s.ing+=i.cant*i.precio;s.cos+=i.cant*i.costo;}));
  return Object.values(m).map(s=>({...s,gan:s.ing-s.cos}));
}
function resumen(ventas){const ing=ventas.reduce((a,v)=>a+totV(v),0),cos=ventas.reduce((a,v)=>a+cosV(v),0);return{ing,cos,gan:ing-cos,n:ventas.length,margen:ing?(ing-cos)/ing:NaN}}
const byFecha=(a,b)=>a.fecha.localeCompare(b.fecha);
const esFiado=v=>v.tipo==='fiado';
/* Saldo = lo fiado − lo pagado. Los pagos se aplican a las compras más antiguas primero (FIFO). */
function saldoCliente(id){let s=0;D.ventas.forEach(v=>{if(v.clienteId===id&&esFiado(v))s+=totV(v)});D.pagos.forEach(p=>{if(p.clienteId===id)s-=p.monto});return Math.round(s*100)/100}
function deudaCliente(id){return Math.max(0,saldoCliente(id))}
function cuenta(id){
  const ventas=D.ventas.filter(v=>v.clienteId===id).sort(byFecha),fiadas=ventas.filter(esFiado);
  const pagos=D.pagos.filter(p=>p.clienteId===id).sort(byFecha);
  const totalFiado=fiadas.reduce((a,v)=>a+totV(v),0),totalPagado=pagos.reduce((a,p)=>a+p.monto,0);
  const totalComprado=ventas.reduce((a,v)=>a+totV(v),0);
  let disp=totalPagado;const estado={};
  fiadas.forEach(v=>{const t=totV(v),ap=Math.min(t,Math.max(0,disp));disp-=ap;estado[v.id]={total:t,abonado:ap,debe:t-ap}});
  const movs=[...ventas.map(v=>({k:'venta',fecha:v.fecha,v})),...pagos.map(p=>({k:'pago',fecha:p.fecha,p}))].sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.k==='venta'?-1:1));
  let s=0;movs.forEach(m=>{if(m.k==='venta'&&esFiado(m.v))s+=totV(m.v);if(m.k==='pago')s-=m.p.monto;m.saldo=s});
  const pend=fiadas.filter(v=>estado[v.id].debe>0.5);
  const cant={};ventas.forEach(v=>v.items.forEach(i=>cant[i.nombre]=(cant[i.nombre]||0)+i.cant));
  const favoritos=Object.entries(cant).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return{ventas,fiadas,pagos,totalFiado,totalPagado,totalComprado,saldo:totalFiado-totalPagado,estado,movs,pend,favoritos,
    ultimoPago:pagos[pagos.length-1],desde:[ventas[0]?.fecha,pagos[0]?.fecha].filter(Boolean).sort()[0]};
}
function deudores(){return D.clientes.map(c=>({c,s:saldoCliente(c.id)})).filter(x=>x.s>0.5).sort((a,b)=>b.s-a.s)}
const fFH=iso=>`${fFecha(iso)} · ${fHora(iso)}`;
const fFechaL=iso=>{const d=new Date(iso);return `${d.getDate()} de ${MESL[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' de '+d.getFullYear():''}`};
const toLocalInput=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
const MEDIOS=['Efectivo','Nequi','Daviplata','Transferencia'];
function vendidoUlt(dias,pid){const t=Date.now()-dias*864e5;return D.ventas.filter(v=>new Date(v.fecha).getTime()>=t).reduce((a,v)=>a+v.items.filter(i=>i.productoId===pid).reduce((b,i)=>b+i.cant,0),0)}

/* ===================== Estado de UI ===================== */
const UI={view:'inicio',prev:'fiados',cid:null,cTab:'movs',prodTab:'catalogo',fiadoTab:'cobrar',periodo:'q',qOff:0,cart:{},cliente:'',pedido:{},buscarCli:''};
const NAV=[['inicio','Inicio','home'],['vender','Vender','cart'],['fiados','Fiados','book'],['productos','Productos','box'],['reportes','Reportes','chart']];

/* ===================== Render ===================== */
function aplicarTema(){const t=D.config.tema==='dark'?'dark':'light';document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name=theme-color]');m.content=getComputedStyle(document.documentElement).getPropertyValue('--surface-100').trim()||'#f7f4ec';}
function render(){
  if(UI.cliente&&!cli(UI.cliente))UI.cliente='';
  Object.keys(UI.cart).forEach(id=>{if(!prod(id))delete UI.cart[id]});
  if(UI.view==='cliente'&&!cli(UI.cid))UI.view='fiados';
  const views={inicio:vInicio,vender:vVender,fiados:vFiados,productos:vProductos,reportes:vReportes,cliente:vCliente};
  const navOn=k=>UI.view===k||(UI.view==='cliente'&&k==='fiados');
  const nombre=esc(D.config.nombre);
  $('#app').innerHTML=`
  <aside class="side">
    <div class="brandmark"><span class="logo">${ic('cake',19)}</span>${nombre}</div>
    <nav>${NAV.map(([k,l,i])=>`<button class="${navOn(k)?'on':''}" data-a="go" data-v="${k}">${ic(i)}${l}</button>`).join('')}</nav>
    <div class="foot"><nav><button data-a="ajustes">${ic('gear')}Ajustes y respaldo</button></nav></div>
  </aside>
  <main class="main"><div class="wrap">
    <div class="topbar"><div class="brandmark"><span class="logo">${ic('cake',19)}</span>${nombre}</div>
      <button class="iconbtn" data-a="ajustes" aria-label="Ajustes">${ic('gear')}</button></div>
    ${views[UI.view]()}
  </div></main>
  <nav class="bottomnav">${NAV.map(([k,l,i])=>`<button class="${navOn(k)?'on':''}" data-a="go" data-v="${k}"><span class="pill">${ic(i,22)}</span>${l}</button>`).join('')}</nav>
  ${UI.view==='vender'?cartBar():''}`;
}

/* ---------- Inicio ---------- */
function vInicio(){
  if(!D.productos.length) return `
  <div class="stack">
    <div class="pagehead"><div><p class="eyebrow">Bienvenido</p><h1>Arranquemos tu tienda</h1></div></div>
    <div class="card empty"><div class="big">${ic('box',28)}</div>
      <h2>Agrega tus productos</h2>
      <p class="muted" style="max-width:420px;margin:6px auto 18px">Pon el precio al que te llegan y el precio al que los vendes. La app calcula la ganancia, te dice cuál deja más y arma la lista de pedido.</p>
      <div class="row" style="justify-content:center;flex-wrap:wrap">
        <button class="btn primary" data-a="nuevoProd">${ic('plus')}Agregar producto</button>
        <button class="btn ghost" data-a="demo">Ver con datos de ejemplo</button>
      </div></div>
  </div>`;
  const q=quincena(),vq=ventasEn(q),r=resumen(vq);
  const deu=deudores(),porCobrar=deu.reduce((a,x)=>a+x.s,0);
  const nDeud=deu.length;
  const bajos=D.productos.filter(p=>p.stock<=p.minimo);
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const dias=Math.round((q.pago-hoy)/864e5);
  let st=statsProd(vq);if(!vq.length)st=statsProd(D.ventas);
  const topG=[...st].sort((a,b)=>b.gan-a.gan)[0],topU=[...st].sort((a,b)=>b.unid-a.unid)[0];
  const ult=[...D.ventas].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,8);
  const sinPrecio=D.productos.filter(p=>!p.precio||!p.costo).length;
  const sinStock=D.productos.filter(p=>p.stock<=0).length;
  return `<div class="stack">
  <div class="pagehead"><div><p class="eyebrow">Quincena ${q.label}</p><h1>Resumen</h1></div>
    <button class="btn primary" data-a="go" data-v="vender">${ic('plus')}Nueva venta</button></div>
  ${sinPrecio||(!D.ventas.length&&sinStock)?`<div class="card" style="border-color:var(--accent);background:var(--accent-soft)"><div class="row" style="align-items:flex-start">${ic('alert',22)}<div style="flex:1"><b>Termina de configurar tus productos</b>
    <p class="small muted" style="margin:2px 0 10px">${sinPrecio?`${sinPrecio} producto${sinPrecio===1?'':'s'} sin precio de costo o de venta. `:''}${sinStock?`${sinStock} sin unidades: regístralas en Productos → Compras.`:''}</p>
    <div class="row wrapflex"><button class="btn sm primary" data-a="go" data-v="productos">Poner precios</button>${sinStock?`<button class="btn sm ghost" data-a="nuevaCompra">${ic('truck',16)}Registrar unidades</button>`:''}</div></div></div></div>`:''}
  <div class="grid kpis">
    <div class="card kpi brand"><p class="eyebrow">Vendido</p><div class="val">${fmt(r.ing)}</div><p class="small muted">${r.n} venta${r.n===1?'':'s'} en la quincena</p></div>
    <div class="card kpi"><p class="eyebrow">Ganancia</p><div class="val pos">${fmt(r.gan)}</div><p class="small muted">Margen ${pct(r.margen)}</p></div>
    <div class="card kpi accent" data-a="go" data-v="fiados" style="cursor:pointer"><p class="eyebrow">Por cobrar</p><div class="val warn">${fmt(porCobrar)}</div><p class="small muted">${nDeud} cliente${nDeud===1?'':'s'} con saldo</p></div>
    <div class="card kpi" data-a="irPedido" style="cursor:pointer"><p class="eyebrow">Stock bajo</p><div class="val ${bajos.length?'neg':''}">${bajos.length}</div><p class="small muted">${bajos.length?'Ver lista de pedido →':'Todo en orden'}</p></div>
  </div>
  <div class="payday">${ic('cal',26)}<div class="grow" style="flex:1"><b>Día de cobro: ${q.pago.getDate()} de ${MESL[q.pago.getMonth()]}</b><p class="small muted">${dias<=0?'Es hoy — revisa la cuenta de cada cliente':`Faltan ${dias} día${dias===1?'':'s'}`}</p></div><div class="d">${fmt(porCobrar)}</div></div>
  ${(topG&&(topG.gan>0||topU.unid>0))?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
    <div class="card star"><span class="ico" style="background:var(--brand-soft);color:var(--brand-text)">${ic('trophy',22)}</span><div style="min-width:0"><p class="eyebrow">El que más ganancia deja${vq.length?'':' · histórico'}</p><h3 class="ellipsis">${esc(topG.nombre)}</h3><p class="small muted">${fmt(topG.gan)} de ganancia · ${fmtN(topG.unid)} und</p></div></div>
    <div class="card star"><span class="ico" style="background:var(--accent-soft);color:var(--accent-text)">${ic('fire',22)}</span><div style="min-width:0"><p class="eyebrow">El más vendido${vq.length?'':' · histórico'}</p><h3 class="ellipsis">${esc(topU.nombre)}</h3><p class="small muted">${fmtN(topU.unid)} unidades · ${fmt(topU.ing)}</p></div></div>
  </div>`:''}
  <div class="section-h"><h2>Últimas ventas</h2><button class="btn sm ghost" data-a="go" data-v="reportes">Ver reportes</button></div>
  <div class="card">${ult.length?`<div class="list">${ult.map(filaVenta).join('')}</div>`:`<p class="muted empty">Aún no hay ventas. Toca “Nueva venta”.</p>`}</div>
  </div>`;
}
function chipVenta(v){
  if(!esFiado(v))return '<span class="chip">Contado</span>';
  const e=cuenta(v.clienteId).estado[v.id];if(!e)return '<span class="chip warn">Fiada</span>';
  return e.debe<=0.5?'<span class="chip ok">Pagada</span>':e.abonado>0?'<span class="chip warn">Abonada</span>':'<span class="chip warn">Fiada</span>';
}
function filaVenta(v){
  const c=cli(v.clienteId);
  return `<div class="li"><span class="avatar" ${c?`data-a="verCliente" data-id="${c.id}" style="cursor:pointer"`:''}>${c?esc(iniciales(c.nombre)):ic('cart',18)}</span>
  <div class="grow" ${c?`data-a="verCliente" data-id="${c.id}" style="cursor:pointer"`:''}><div class="row between"><b class="ellipsis">${c?esc(c.nombre):v.clienteId?'Cliente eliminado':'Contado'}</b><b class="num">${fmt(totV(v))}</b></div>
  <div class="row between small muted"><span class="ellipsis">${v.items.map(i=>`${i.cant}× ${esc(i.nombre)}`).join(', ')}</span>
  <span style="flex:none">${fFecha(v.fecha)} ${chipVenta(v)}</span></div></div>
  <button class="iconbtn" data-a="anular" data-id="${v.id}" aria-label="Anular venta">${ic('trash',18)}</button></div>`;
}

/* ---------- Vender ---------- */
function vVender(){
  if(!D.productos.length) return `<div class="card empty" style="margin-top:12px"><div class="big">${ic('box',28)}</div><h2>Primero agrega productos</h2><p class="muted" style="margin:6px 0 16px">Necesitas al menos un producto para vender.</p><button class="btn primary" data-a="nuevoProd">${ic('plus')}Agregar producto</button></div>`;
  const cs=UI.cliente&&cli(UI.cliente);
  return `<div class="stack">
  <div class="pagehead"><div><p class="eyebrow">Registrar venta</p><h1>¿Qué se lleva?</h1></div></div>
  ${cs?`<div class="para"><span class="avatar">${esc(iniciales(cs.nombre))}</span><div style="flex:1;min-width:0"><span class="small muted">Venta para</span><b class="ellipsis" style="display:block">${esc(cs.nombre)}</b></div><button class="btn sm ghost" data-a="quitarCli">${ic('x',16)}Quitar</button></div>`
     :`<p class="small muted" style="margin-top:-8px">Toca los productos. Al final eliges si es de contado o a quién se le fía.</p>`}
  ${D.productos.length>5?`<label class="search">${ic('search',18)}<input class="input" id="buscar" type="search" placeholder="Buscar producto…" value="${esc(UI.buscar||'')}" autocomplete="off"></label>`:''}
  <div class="grid sgrid">${D.productos.map(p=>{const c=UI.cart[p.id]||0;const bajo=p.stock<=p.minimo;const q=norm(UI.buscar);
    return `<div class="card sell ${c?'sel':''}" role="button" tabindex="0" aria-label="Agregar ${esc(p.nombre)}" data-a="add" data-id="${p.id}" data-n="${esc(norm(p.nombre))}" ${q&&!norm(p.nombre).includes(q)?'hidden':''} style="${p.precio?'':'opacity:.55'}">
      <b style="line-height:20px">${esc(p.nombre)}</b>
      <span class="price">${p.precio?fmt(p.precio):'<span class="small warn">Sin precio</span>'}</span>
      <span class="small ${p.stock<=0?'neg':bajo?'warn':'muted'}">${p.stock<=0?'Agotado':`Quedan ${fmtN(p.stock-c)}`}</span>
      ${c?`<div class="stepper" data-a="noop"><button data-a="sub" data-id="${p.id}" aria-label="Quitar">${ic('minus',16)}</button><b>${c}</b><button class="plus" data-a="add" data-id="${p.id}" aria-label="Agregar">${ic('plus',16)}</button></div>`:''}
    </div>`}).join('')}</div>
  <div style="height:90px"></div></div>`;
}
function cartBar(){
  const items=Object.entries(UI.cart).filter(([,c])=>c>0);
  if(!items.length)return'';
  let tot=0,gan=0,und=0;items.forEach(([id,c])=>{const p=prod(id);if(!p)return;tot+=c*p.precio;gan+=c*(p.precio-p.costo);und+=c});
  return `<div class="cartbar"><div style="flex:1;min-width:0"><div class="t">${fmt(tot)}</div><div class="small" style="opacity:.75">${und} und · ganas ${fmt(gan)}</div></div>
  <button class="btn ghost" data-a="vender" data-pagado="1">Contado</button>
  <button class="btn accent" data-a="fiar">Fiar…</button></div>`;
}

/* ---------- Fiados ---------- */
function filaCliente(c,extra){
  const k=cuenta(c.id),sal=k.saldo;
  const sub=sal>0.5&&k.pend.length?`Debe desde ${fFecha(k.pend[0].fecha)}`:k.ventas.length?`Ha comprado ${fmt(k.totalComprado)}`:'Sin compras';
  return `<div class="li clickable" data-a="verCliente" data-id="${c.id}" role="button" tabindex="0">
    <span class="avatar">${esc(iniciales(c.nombre))}</span>
    <div class="grow"><b class="ellipsis" style="display:block">${esc(c.nombre)}</b>
      <span class="small muted">${c.area?esc(c.area)+' · ':''}${sub}${k.ultimoPago?` · pagó ${fFecha(k.ultimoPago.fecha)}`:''}</span></div>
    <div class="rcol">${sal>0.5?`<b class="num warn">${fmt(sal)}</b>`:sal<-0.5?`<span class="chip ok">A favor ${fmt(-sal)}</span>`:'<span class="chip ok">Al día</span>'}
    ${extra||''}</div><span class="chev" aria-hidden="true">›</span></div>`;
}
function vFiados(){
  const q=quincena(),deu=deudores(),total=deu.reduce((a,x)=>a+x.s,0);
  const head=`<div class="pagehead"><div><p class="eyebrow">Ventas a crédito</p><h1>Fiados</h1></div>
   <div class="seg"><button class="${UI.fiadoTab==='cobrar'?'on':''}" data-a="fiadoTab" data-v="cobrar">Por cobrar</button><button class="${UI.fiadoTab==='clientes'?'on':''}" data-a="fiadoTab" data-v="clientes">Clientes</button><button class="${UI.fiadoTab==='pagos'?'on':''}" data-a="fiadoTab" data-v="pagos">Pagos</button></div></div>`;
  if(UI.fiadoTab==='clientes'){
    const qq=norm(UI.buscarCli);
    const cs=[...D.clientes].sort((a,b)=>a.nombre.localeCompare(b.nombre));
    return `<div class="stack">${head}
    <div class="row between"><p class="muted">${cs.length} cliente${cs.length===1?'':'s'}</p><button class="btn primary sm" data-a="nuevoCli">${ic('plus',16)}Nuevo cliente</button></div>
    ${cs.length>4?`<label class="search">${ic('search',18)}<input class="input" id="buscarCli" type="search" placeholder="Buscar cliente…" value="${esc(UI.buscarCli||'')}" autocomplete="off"></label>`:''}
    <div class="card">${cs.length?`<div class="list" id="listaCli">${cs.map(c=>filaCliente(c).replace('<div class="li clickable"',`<div class="li clickable" data-n="${esc(norm(c.nombre+' '+(c.area||'')))}" ${qq&&!norm(c.nombre+' '+(c.area||'')).includes(qq)?'hidden':''}`)).join('')}</div>`
      :`<div class="empty"><div class="big">${ic('user',26)}</div><h3>Sin clientes todavía</h3><p class="muted small">Agrega a tus compañeros de la empresa para fiarles.</p></div>`}</div></div>`;
  }
  if(UI.fiadoTab==='pagos'){
    const ps=[...D.pagos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const enQ=ps.filter(p=>{const t=new Date(p.fecha);return t>=q.ini&&t<=q.fin});
    return `<div class="stack">${head}
    <div class="payday" style="background:var(--gain-soft)">${ic('check',26)}<div style="flex:1"><b>Recibido esta quincena</b><p class="small muted">${enQ.length} pago${enQ.length===1?'':'s'} · ${q.label}</p></div><div class="d" style="color:var(--gain)">${fmt(enQ.reduce((a,p)=>a+p.monto,0))}</div></div>
    <div class="card">${ps.length?`<div class="list">${ps.slice(0,60).map(p=>{const c=cli(p.clienteId);return `<div class="li">
      <span class="mov-ico pago">${ic('check',18)}</span>
      <div class="grow" ${c?`data-a="verCliente" data-id="${c.id}" style="cursor:pointer"`:''}><b class="ellipsis" style="display:block">${c?esc(c.nombre):'Cliente eliminado'}</b><span class="small muted">${fFH(p.fecha)} · ${esc(p.medio||'Efectivo')}${p.nota?' · '+esc(p.nota):''}</span></div>
      <b class="num pos">${fmt(p.monto)}</b></div>`}).join('')}</div>`:`<div class="empty"><div class="big">${ic('check',26)}</div><h3>Aún no hay pagos</h3><p class="muted small">Cada pago que registres queda aquí con fecha, hora y medio de pago.</p></div>`}</div></div>`;
  }
  return `<div class="stack">${head}
  <div class="payday">${ic('cal',26)}<div style="flex:1"><b>Total por cobrar</b><p class="small muted">${deu.length} cliente${deu.length===1?'':'s'} · próximo cobro ${q.pago.getDate()} de ${MESL[q.pago.getMonth()]}</p></div><div class="d">${fmt(total)}</div></div>
  <div class="card">${deu.length?`<div class="list">${deu.map(({c})=>filaCliente(c,`<button class="btn sm primary" data-a="abono" data-id="${c.id}">Cobrar</button>`)).join('')}</div>`
   :`<div class="empty"><div class="big">${ic('check',28)}</div><h3>Nadie te debe</h3><p class="muted small">Cuando fíes una venta, el cliente aparecerá aquí con su saldo.</p></div>`}</div>
  </div>`;
}

/* ---------- Hoja de vida del cliente ---------- */
function vCliente(){
  const c=cli(UI.cid),k=cuenta(c.id),sal=k.saldo;
  const estadoCard=sal>0.5
    ?`<div class="saldo debe"><p class="eyebrow">Debe</p><div class="big num">${fmt(sal)}</div><p class="small">${k.pend.length} compra${k.pend.length===1?'':'s'} pendiente${k.pend.length===1?'':'s'} · la más antigua del ${fFechaL(k.pend[0].fecha)}</p></div>`
    :sal<-0.5?`<div class="saldo ok"><p class="eyebrow">Saldo a favor</p><div class="big num">${fmt(-sal)}</div><p class="small">Pagó de más; se descuenta de su próxima compra fiada.</p></div>`
    :`<div class="saldo ok"><p class="eyebrow">Estado</p><div class="big">A paz y salvo</div><p class="small">${k.ultimoPago?`Último pago el ${fFechaL(k.ultimoPago.fecha)}`:'No tiene deudas'}</p></div>`;
  const tabs=[['movs','Movimientos'],['compras',`Compras (${k.ventas.length})`],['pagos',`Pagos (${k.pagos.length})`]];
  let body='';
  if(UI.cTab==='compras'){
    body=k.ventas.length?[...k.ventas].reverse().map(v=>{const e=k.estado[v.id];
      const st=!esFiado(v)?'<span class="chip">Contado</span>':e.debe<=0.5?'<span class="chip ok">Pagada</span>':e.abonado>0?`<span class="chip warn">Abonó ${fmt(e.abonado)} · debe ${fmt(e.debe)}</span>`:'<span class="chip warn">Pendiente</span>';
      return `<div class="li" style="align-items:flex-start"><span class="mov-ico ${esFiado(v)?'cargo':''}">${ic('cart',18)}</span>
      <div class="grow"><div class="row between"><b>${fFH(v.fecha)}</b><b class="num">${fmt(totV(v))}</b></div>
      <div class="small muted">${v.items.map(i=>`${i.cant}× ${esc(i.nombre)} (${fmt(i.precio)})`).join(', ')}</div><div style="margin-top:6px">${st}</div></div>
      <button class="iconbtn" data-a="anular" data-id="${v.id}" aria-label="Anular compra">${ic('trash',18)}</button></div>`}).join(''):'<p class="muted empty">Sin compras.</p>';
  }else if(UI.cTab==='pagos'){
    body=k.pagos.length?[...k.pagos].reverse().map(p=>`<div class="li"><span class="mov-ico pago">${ic('check',18)}</span>
      <div class="grow"><div class="row between"><b>${fFH(p.fecha)}</b><b class="num pos">${fmt(p.monto)}</b></div>
      <div class="small muted">${esc(p.medio||'Efectivo')}${p.nota?' · '+esc(p.nota):''}</div></div>
      <button class="iconbtn" data-a="waRecibo" data-id="${p.id}" aria-label="Enviar comprobante">${ic('chat',18)}</button>
      <button class="iconbtn" data-a="anularPago" data-id="${p.id}" aria-label="Anular pago">${ic('trash',18)}</button></div>`).join(''):'<p class="muted empty">Aún no ha pagado nada.</p>';
  }else{
    body=k.movs.length?[...k.movs].reverse().map(m=>{
      if(m.k==='pago')return `<div class="li"><span class="mov-ico pago">${ic('check',18)}</span>
        <div class="grow"><div class="row between"><b>Pago · ${esc(m.p.medio||'Efectivo')}</b><b class="num pos">− ${fmt(m.p.monto)}</b></div>
        <div class="row between small muted"><span>${fFH(m.fecha)}${m.p.nota?' · '+esc(m.p.nota):''}</span><span>Saldo ${fmt(m.saldo)}</span></div></div></div>`;
      const v=m.v,f=esFiado(v);
      return `<div class="li"><span class="mov-ico ${f?'cargo':''}">${ic('cart',18)}</span>
        <div class="grow"><div class="row between"><b>${f?'Compra fiada':'Compra de contado'}</b><b class="num ${f?'warn':'muted'}">${f?'+ ':''}${fmt(totV(v))}</b></div>
        <div class="row between small muted" style="align-items:flex-start"><span>${fFH(m.fecha)} · ${v.items.map(i=>`${i.cant}× ${esc(i.nombre)}`).join(', ')}</span><span style="flex:none">${f?'Saldo '+fmt(m.saldo):'pagada'}</span></div></div></div>`;
    }).join(''):'<p class="muted empty">Todavía no tiene movimientos.</p>';
  }
  return `<div class="stack">
  <div class="row" style="margin-top:4px"><button class="btn sm ghost" data-a="volver">‹ Volver</button></div>
  <div class="row" style="align-items:center;gap:14px">
    <span class="avatar xl">${esc(iniciales(c.nombre))}</span>
    <div style="flex:1;min-width:0"><h1 style="overflow-wrap:anywhere">${esc(c.nombre)}</h1><p class="small muted">${[c.area&&esc(c.area),c.tel&&esc(c.tel),k.desde&&'cliente desde el '+fFechaL(k.desde)].filter(Boolean).join(' · ')||'Sin datos adicionales'}</p></div>
    <button class="iconbtn" data-a="editCli" data-id="${c.id}" aria-label="Editar cliente">${ic('edit',20)}</button>
  </div>
  ${estadoCard}
  <div class="row wrapflex">
    <button class="btn primary" data-a="abono" data-id="${c.id}">${ic('check',18)}Registrar pago</button>
    <button class="btn ghost" data-a="venderA" data-id="${c.id}">${ic('cart',18)}Venderle</button>
    <button class="btn ghost" data-a="waCobro" data-id="${c.id}">${ic('chat',18)}Enviar estado de cuenta</button>
  </div>
  <div class="grid kpis">
    <div class="card kpi"><p class="eyebrow">Ha comprado</p><div class="val">${fmt(k.totalComprado)}</div><p class="small muted">${k.ventas.length} compra${k.ventas.length===1?'':'s'}</p></div>
    <div class="card kpi"><p class="eyebrow">Ha pagado</p><div class="val pos">${fmt(k.totalPagado)}</div><p class="small muted">${k.pagos.length} pago${k.pagos.length===1?'':'s'} de fiados</p></div>
    <div class="card kpi"><p class="eyebrow">Último pago</p><div class="val">${k.ultimoPago?fmt(k.ultimoPago.monto):'—'}</div><p class="small muted">${k.ultimoPago?fFH(k.ultimoPago.fecha):'Nunca'}</p></div>
    <div class="card kpi"><p class="eyebrow">Lo que más compra</p><div class="small" style="margin-top:6px;font-weight:700">${k.favoritos.length?k.favoritos.map(([n,q])=>`${esc(n)} <span class="muted">(${fmtN(q)})</span>`).join('<br>'):'—'}</div></div>
  </div>
  <div class="seg">${tabs.map(([t,l])=>`<button class="${UI.cTab===t?'on':''}" data-a="cTab" data-v="${t}">${l}</button>`).join('')}</div>
  <div class="card"><div class="list">${body}</div></div>
  </div>`;
}

/* ---------- Productos ---------- */
function vProductos(){
  const head=`<div class="pagehead"><div><p class="eyebrow">Inventario</p><h1>Productos</h1></div>
  <div class="seg">${[['catalogo','Catálogo'],['pedido','Lista de pedido'],['compras','Compras']].map(([k,l])=>`<button class="${UI.prodTab===k?'on':''}" data-a="prodTab" data-v="${k}">${l}</button>`).join('')}</div></div>`;
  if(UI.prodTab==='pedido')return `<div class="stack">${head}${vPedido()}</div>`;
  if(UI.prodTab==='compras')return `<div class="stack">${head}${vCompras()}</div>`;
  return `<div class="stack">${head}
  <div class="row between"><p class="muted">${D.productos.length} producto${D.productos.length===1?'':'s'}</p><button class="btn primary sm" data-a="nuevoProd">${ic('plus',16)}Nuevo producto</button></div>
  ${D.productos.length?`<div class="grid pgrid">${D.productos.map(p=>{const g=p.precio-p.costo,m=p.precio?g/p.precio:NaN,bajo=p.stock<=p.minimo;
    return `<div class="card prod"><div class="row between" style="align-items:flex-start"><span class="name" style="min-width:0;line-height:22px;padding-top:9px">${esc(p.nombre)}</span>
      <div class="row" style="gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:58%">${!p.precio||!p.costo?'<span class="chip warn">Falta precio</span>':''}<span class="chip ${p.stock<=0?'bad':bajo?'warn':'ok'}">${fmtN(p.stock)} und</span><button class="iconbtn" data-a="editProd" data-id="${p.id}" aria-label="Editar">${ic('edit',18)}</button></div></div>
      <p class="small muted" style="margin-top:2px">${p.caja&&p.uxc?`Caja de ${fmtN(p.uxc)} und a ${fmt(p.caja)}`:'Sin datos de la caja'}</p>
      ${p.costo&&p.precio?`<div class="profit ${g<0?'bad':''}"><b>${g<0?'−':'+'}${pct(Math.abs(g)/p.costo)}</b><span>${g<0?'pierdes':'ganas'} ${fmtC(Math.abs(g))} por unidad</span></div>`:''}
      <div class="kv"><div><span>Me sale a</span><b>${p.costo?fmtC(p.costo):'—'}</b></div><div><span>Lo vendo a</span><b>${p.precio?fmt(p.precio):'—'}</b></div>
      <div><span>Ganancia por caja</span><b class="${g<0?'neg':'pos'}">${p.costo&&p.precio?fmt(g*p.uxc):'—'}</b></div><div><span>Margen s/ venta</span><b class="${g<0?'neg':''}">${p.costo&&p.precio?pct(m):'—'}</b></div></div>
      ${!p.precio||!p.costo?`<button class="btn sm primary" style="margin-top:12px;width:100%" data-a="editProd" data-id="${p.id}">Poner precios</button>`:''}</div>`}).join('')}</div>`
  :`<div class="card empty"><div class="big">${ic('box',28)}</div><h3>Sin productos</h3><p class="muted small" style="margin-bottom:14px">Agrega tus productos para empezar.</p><button class="btn primary" data-a="nuevoProd">${ic('plus')}Agregar producto</button></div>`}

function analisisCobro(){

  D.clientes.concat([{id:null}]).forEach(()=>{});
  const porCli={};D.ventas.filter(esFiado).forEach(v=>{(porCli[v.clienteId]=porCli[v.clienteId]||{v:[],p:[]}).v.push(v)});
  D.pagos.forEach(p=>{(porCli[p.clienteId]=porCli[p.clienteId]||{v:[],p:[]}).p.push(p)});

    const rest=v.map(x=>({v:x,falta:totV(x)}));let i=0;
    p.forEach(pg=>{let m=pg.monto;while(m>0.5&&i<rest.length){const r=rest[i],ap=Math.min(r.falta,m);r.falta-=ap;m-=ap;if(r.falta<=0.5){r.pagadaEn=pg.fecha>r.v.fecha?pg.fecha:r.v.fecha;i++}}});
    rest.forEach(r=>out[r.v.id]={debe:Math.max(0,r.falta),pagadaEn:r.pagadaEn||null,total:totV(r.v)});
  });

  const pagos=D.pagos.filter(p=>enRango(p.fecha)).reduce((a,p)=>a+p.monto,0);
  const compras=D.compras.filter(c=>enRango(c.fecha)).reduce((a,c)=>a+c.items.reduce((b,i)=>b+i.cant*i.costo,0),0);
  return{...R,ganCob,ganPend:R.gan-ganCob,venCob,venPend:R.ing-venCob,contado,pagos,entro:contado+pagos,compras,neto:contado+pagos-compras,ticket:R.n?R.ing/R.n:0};

      ${ly!==cy+4?`<line x1="${right?cx+7:cx-7}" y1="${cy}" x2="${right?cx+11:cx-11}" y2="${ly-4}" class="medl"/>`:''}<text x="${right?cx+12:cx-12}" y="${ly}" class="dlab" text-anchor="${right?'start':'end'}">${esc(txt)}</text></g>`}).join('')})()}
  </svg>`;
  const s5=`<section class="card rsec"><h2>Ganancia vs. popularidad</h2><p class="small muted">Cada punto es un producto. Basado en ${base}. Las líneas punteadas son el punto medio de tus productos.</p>
    ${st.length?sc+`<div class="quads">${Object.entries(Q).map(([k,[t,d]])=>{const ps=st.filter(x=>cuad(x)===k);return `<div class="quad q-${k}"><b>${t}</b><p class="small muted">${d}</p>${ps.length?`<ul>${ps.map(x=>`<li>${esc(x.nombre)} <span class="muted small">· ${fmtN(x.unid)} und · ${fmt(x.gu)} c/u</span></li>`).join('')}</ul>`:'<p class="small muted"><i>Ninguno</i></p>'}</div>`}).join('')}</div>`:'<p class="muted">Sin productos.</p>'}
  </section>`;
  /* 6. Detalle */
  const R=statsProd(ventasEn(q)).filter(x=>x.unid>0).sort((a,b)=>b.gan-a.gan);
  const s6=`<section class="card rsec"><h2>Detalle por producto</h2>${R.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>Und</th><th>Ventas</th><th>Costo</th><th>Ganancia</th><th>Gana c/u</th><th>% de la ganancia</th></tr></thead><tbody>
    ${R.map(s=>`<tr><td><b>${esc(s.nombre)}</b></td><td>${fmtN(s.unid)}</td><td>${fmt(s.ing)}</td><td>${fmt(s.cos)}</td><td class="pos"><b>${fmt(s.gan)}</b></td><td>${fmt(s.gan/s.unid)}</td><td>${pct(M.gan?s.gan/M.gan:NaN)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td>${fmtN(R.reduce((a,s)=>a+s.unid,0))}</td><td>${fmt(M.ing)}</td><td>${fmt(M.cos)}</td><td>${fmt(M.gan)}</td><td></td><td>100 %</td></tr></tfoot></table></div>`:'<p class="muted">Sin ventas en esta quincena.</p>'}</section>`;
  return `<div class="stack reportes">
  <div class="printonly"><h1>${esc(D.config.nombre)} — Reporte</h1><p>Quincena ${qLabel(q)} · impreso el ${fFechaL(new Date().toISOString())}, ${fHora(new Date().toISOString())}</p></div>
  <div class="pagehead noprint"><div><p class="eyebrow">Análisis</p><h1>Reportes</h1></div><button class="btn ghost sm" data-a="imprimir">${ic('down',16)}Imprimir / PDF</button></div>
  ${nav}${s1}${s2}${s3}${s4}${s5}${s6}</div>`;
}

function calcProd(){
  const f=document.querySelector('[data-form=producto]');if(!f)return;
  const caja=money(f.caja.value),u=Math.max(0,Math.round(num(f.uxc.value))),c=u?caja/u:0,p=money(f.precio.value),g=p-c;
  $('#unitcost').innerHTML=c?`<span>Cada unidad te sale a</span><b class="num">${fmtC(c)}</b><small>${fmt(caja)} ÷ ${fmtN(u)} unidades</small>`:`<span>Cada unidad te sale a</span><b>—</b><small>Pon el valor de la caja y cuántas unidades trae</small>`;
  const calc=$('#calc');
  if(!c||!p){calc.innerHTML='';}
  else calc.innerHTML=`<div class="verdict ${g<0?'bad':''}">
    <p>${g<0?`Con <b>${fmt(p)}</b> <b>pierdes ${fmtC(-g)}</b> por unidad. Sube el precio.`:`Con <b>${fmt(p)}</b> le ganas <b>${fmtC(g)}</b> a cada unidad.`}</p>
    <div class="calc"><div><span>Ganancia</span><b>${pct(g/c)}</b></div><div><span>Margen</span><b>${pct(g/p)}</b></div><div><span>x caja</span><b>${fmt(g*u)}</b></div></div>
    <p class="small muted"><b>Ganancia %</b> = lo que ganas ÷ lo que te costó. <b>Margen</b> = lo que ganas ÷ precio de venta.</p>
    <p class="small muted">Vendiendo la caja completa (${fmtN(u)} und) recibes ${fmt(p*u)} y ganas ${fmt(g*u)}.</p></div>`;
  const mk=num($('#mk').value);$('#sug').textContent=c?fmt(Math.ceil(c*(1+mk/100)/100)*100):'—';
}

const A={
  go:d=>{UI.view=d.v;if(d.v==='fiados'&&UI.fiadoTab==='')UI.fiadoTab='cobrar';render();scrollTo(0,0)},
  close:()=>closeModal(),
  noop:()=>{},
  okConfirm:()=>{const f=onConfirm;onConfirm=null;closeModal();f&&f()},
  ajustes:()=>modalAjustes(),
  irPedido:()=>{UI.view='productos';UI.prodTab='pedido';UI.pedido={};render()},

  fiadoTab:d=>{UI.fiadoTab=d.v;render()},
  periodo:d=>{UI.periodo=d.v;render()},
  qNav:d=>{UI.qOff=Math.max(0,UI.qOff+(+d.v));render()},
  imprimir:()=>{try{window.print()}catch(e){toast('No se pudo abrir la impresión')}},
  nuevoProd:()=>modalProducto(),
  editProd:d=>modalProducto(d.id),
  delProd:d=>confirmar('¿Eliminar producto?','Las ventas anteriores se conservan en los reportes.',()=>{D.productos=D.productos.filter(p=>p.id!==d.id);delete UI.cart[d.id];save();render();toast('Producto eliminado')},'Eliminar'),
  usarSug:()=>{const f=document.querySelector('[data-form=producto]');const u=num(f.uxc.value),c=u?money(f.caja.value)/u:0;if(!c)return toast('Primero pon el costo');f.precio.value=fmtIn(Math.ceil(c*(1+num($('#mk').value)/100)/100)*100);calcProd()},
  nuevoCli:d=>modalCliente(null,d.from),
  editCli:d=>modalCliente(d.id),
  delCli:d=>{if(Math.abs(saldoCliente(d.id))>0.5)return toast('Tiene saldo pendiente o a favor: déjalo en cero primero');confirmar('¿Eliminar cliente?','Sus compras y pagos se conservan en los reportes.',()=>{D.clientes=D.clientes.filter(c=>c.id!==d.id);if(UI.cliente===d.id)UI.cliente='';if(UI.cid===d.id)UI.view='fiados';save();render();toast('Cliente eliminado')},'Eliminar')},
  add:(d,el,e)=>{e.stopPropagation();const p=prod(d.id),c=UI.cart[d.id]||0;if(!p.precio)return toast(`Ponle precio de venta a ${p.nombre} primero`);if(c+1>p.stock)return toast(p.stock<=0?`${p.nombre} está agotado`:`Solo quedan ${fmtN(p.stock)} de ${p.nombre}`);UI.cart[d.id]=c+1;vib();render()},
  sub:(d,el,e)=>{e.stopPropagation();UI.cart[d.id]=Math.max(0,(UI.cart[d.id]||0)-1);render()},
  fiar:d=>{if(!carrito().length)return;if(UI.cliente&&!d.cambiar&&cli(UI.cliente))return modalConfirmFiar(UI.cliente);modalElegirCliente()},
  pickCli:d=>modalConfirmFiar(d.id),
  confirmFiar:d=>{closeModal();UI.cliente=d.id;A.vender({pagado:'0'})},
  quitarCli:()=>{UI.cliente='';render()},
  vender:d=>{
    const pagado=d.pagado==='1';
    const items=Object.entries(UI.cart).filter(([id,c])=>c>0&&prod(id)).map(([id,c])=>{const p=prod(id);return{productoId:id,nombre:p.nombre,cant:c,precio:p.precio,costo:p.costo}});
    if(!items.length)return;
    if(!pagado&&!UI.cliente)return toast('Elige el cliente para fiar');
    const mal=items.find(i=>{const p=prod(i.productoId);return !p||i.cant>p.stock||!p.precio});
    if(mal){const p=prod(mal.productoId);return toast(!p?'Un producto ya no existe':!p.precio?`${p.nombre} no tiene precio`:`Solo quedan ${fmtN(p.stock)} de ${p.nombre}`)}
    items.forEach(i=>prod(i.productoId).stock-=i.cant);
    const now=new Date().toISOString();
    const vid=uid(),carrito={...UI.cart};
    D.ventas.push({id:vid,fecha:now,clienteId:UI.cliente||null,items,tipo:pagado?'contado':'fiado'});
    const quien=UI.cliente&&cli(UI.cliente)?cli(UI.cliente).nombre:'';
    save();const t=items.reduce((a,i)=>a+i.cant*i.precio,0);UI.cart={};UI.buscar='';UI.cliente='';render();vib();
    toast(pagado?`Venta de ${fmt(t)} registrada${quien?' · '+quien.split(' ')[0]:''}`:`Fiado: ${fmt(t)} a ${quien}`,()=>{
      const v=D.ventas.find(x=>x.id===vid);if(!v)return;v.items.forEach(i=>{const p=prod(i.productoId);if(p)p.stock+=i.cant});
      D.ventas=D.ventas.filter(x=>x.id!==vid);UI.cart=carrito;save();render();toast('Venta deshecha')});
  },
  undo:()=>{const f=undoFn;undoFn=null;$('.toast')?.remove();f&&f()},
  anular:d=>{const v=D.ventas.find(x=>x.id===d.id);if(!v)return;const e=esFiado(v)&&cuenta(v.clienteId).estado[v.id];confirmar('¿Anular esta venta?',`${fmt(totV(v))} del ${fFechaL(v.fecha)} — los productos vuelven al inventario.${e&&e.abonado>0?` Ya tenía ${fmt(e.abonado)} abonado: ese dinero queda como saldo a favor o se aplica a otras compras.`:''}`,()=>{v.items.forEach(i=>{const p=prod(i.productoId);if(p)p.stock+=i.cant});D.ventas=D.ventas.filter(x=>x.id!==d.id);save();render();toast('Venta anulada')},'Anular')},
  verCliente:d=>{if(UI.view!=='cliente')UI.prev=UI.view;UI.view='cliente';UI.cid=d.id;UI.cTab='movs';render();scrollTo(0,0)},
  volver:()=>{UI.view=UI.prev&&UI.prev!=='cliente'?UI.prev:'fiados';render();scrollTo(0,0)},
  cTab:d=>{UI.cTab=d.v;render()},
  venderA:d=>{UI.cliente=d.id;UI.view='vender';render();scrollTo(0,0)},
  abono:(d,el,e)=>{e&&e.stopPropagation();modalAbono(d.id)},
  montoRapido:d=>{const f=document.querySelector('[data-form=abono]');f.monto.value=fmtIn(+d.v);calcAbono()},
  anularPago:d=>{const p=D.pagos.find(x=>x.id===d.id);if(!p)return;confirmar('¿Anular este pago?',`${fmt(p.monto)} del ${fFechaL(p.fecha)} (${esc(p.medio)}). El saldo del cliente vuelve a subir.`,()=>{D.pagos=D.pagos.filter(x=>x.id!==d.id);save();render();toast('Pago anulado')},'Anular pago')},
  waRecibo:d=>{const p=D.pagos.find(x=>x.id===d.id);if(p)abrirWA(cli(p.clienteId)?.tel,textoRecibo(p))},
  waCobro:d=>{const c=cli(d.id),k=cuenta(d.id);
    const ini=k.pend[0]?.fecha;const pagosRec=ini?k.pagos.filter(p=>p.fecha>=ini):k.pagos.slice(-3);
    const lineas=k.pend.map(v=>{const e=k.estado[v.id];return `• ${fFecha(v.fecha)}: ${v.items.map(i=>`${i.cant} ${i.nombre}`).join(', ')} — ${fmt(e.total)}${e.abonado>0?` (abonado ${fmt(e.abonado)}, falta ${fmt(e.debe)})`:''}`});
    const txt=`Hola ${c.nombre.split(' ')[0]}, este es tu estado de cuenta en ${D.config.nombre} (${fFechaL(new Date().toISOString())}, ${fHora(new Date().toISOString())}):\n\n`+
      (lineas.length?`*Compras pendientes:*\n${lineas.join('\n')}\n\n`:'')+
      (pagosRec.length?`*Pagos recibidos:*\n${pagosRec.map(p=>`• ${fFecha(p.fecha)} ${fHora(p.fecha)}: ${fmt(p.monto)} (${p.medio})`).join('\n')}\n\n`:'')+
      (k.saldo>0.5?`*Saldo pendiente: ${fmt(k.saldo)}*`:k.saldo<-0.5?`*Saldo a favor: ${fmt(-k.saldo)}*`:'*Estás a paz y salvo.*')+`\n¡Gracias!`;
    abrirWA(c.tel,txt)},
  waPedido:()=>abrirWA('',textoPedido()),
  copiarPedido:()=>copiar(textoPedido()),
  recalcPedido:()=>{UI.pedido={};render();toast('Cantidades sugeridas recalculadas')},
  llegoPedido:()=>modalCompra(true),
  nuevaCompra:()=>modalCompra(false),
  exportar:()=>{const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`tiendita-respaldo-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Respaldo descargado')},
  importar:()=>$('#fileImport').click(),
  demo:()=>{const go=()=>{D=demo();save();closeModal();UI.view='inicio';UI.cart={};UI.pedido={};render();toast('Datos de ejemplo cargados')};D.productos.length?confirmar('¿Cargar ejemplo?','Esto reemplaza tus datos actuales.',go,'Reemplazar'):go()},
  borrarTodo:()=>confirmar('¿Borrar todos los datos?','Se borran clientes, ventas, compras y precios; quedan tus 7 productos en blanco. Descarga un respaldo antes si lo necesitas.',()=>{const n=D.config;D=inicial();D.config=n;save();UI.cart={};UI.pedido={};UI.view='inicio';render();toast('Datos borrados')},'Borrar todo'),
};
function textoPedido(){const f=D.productos.filter(p=>(UI.pedido[p.id]||0)>0);const t=f.reduce((a,p)=>a+UI.pedido[p.id]*p.caja,0);
  return `Pedido ${D.config.nombre} — ${fFecha(new Date().toISOString())}\n\n${f.map(p=>{const n=UI.pedido[p.id];return `• ${p.nombre}: ${n} caja${n===1?'':'s'} (${fmtN(n*p.uxc)} und)`}).join('\n')||'(sin productos)'}\n\nTotal estimado: ${fmt(t)}`}
function abrirWA(tel,txt){let n=String(tel||'').replace(/\D/g,'');if(n.length===10)n='57'+n;window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`,'_blank')}
function copiar(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado'),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copiado')}catch(e){toast('No se pudo copiar')}a.remove()})}

/* ===================== Eventos ===================== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener('change',e=>{if(e.target.name==='medio')calcAbono()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest('[data-form=producto]'))calcProd();
  if(t.closest('[data-form=abono]'))calcAbono();
  if(t.id==='buscarPick'){const q=norm(t.value);let n=0;document.querySelectorAll('#pickList .pick').forEach(el=>{const h=!!q&&!el.dataset.n.includes(q);el.hidden=h;if(!h)n++});$('#pickNada').hidden=n>0}
  if(t.id==='buscarCli'){UI.buscarCli=t.value;const q=norm(t.value);document.querySelectorAll('#listaCli [data-n]').forEach(el=>el.hidden=!!q&&!el.dataset.n.includes(q))}
  if(t.id==='buscar'){UI.buscar=t.value;const q=norm(t.value);document.querySelectorAll('.sell').forEach(el=>el.hidden=!!q&&!el.dataset.n.includes(q))}
  if(t.classList.contains('money')){const d=money(t.value);t.value=fmtIn(d);if(t.closest('[data-form=producto]'))calcProd()}
  if(t.closest('[data-form=compra]')&&t.name&&/^[cx]-/.test(t.name)){const id=t.name.slice(2),f=t.form,o=$('#u-'+id);if(o)o.textContent=`= ${fmtN(num(f['c-'+id].value)*Math.round(num(f['x-'+id].value)))} und`}
  if(t.dataset.ped){const p=prod(t.dataset.ped);UI.pedido[p.id]=Math.max(0,num(t.value));$('#pc-'+p.id).textContent=fmt(UI.pedido[p.id]*p.caja);$('#pedTot').textContent=fmt(D.productos.reduce((a,x)=>a+(UI.pedido[x.id]||0)*x.caja,0))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='buscarPick'){const v=[...document.querySelectorAll('#pickList .pick')].filter(x=>!x.hidden);if(v.length===1){e.preventDefault();v[0].click()}return}if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();const k=f.dataset.form;
  if(k==='producto'){
    const nombre=f.nombre.value.trim();if(!nombre)return;
    const caja=money(f.caja.value),uxc=Math.max(1,Math.round(num(f.uxc.value)));
    const data={nombre,caja,uxc,costo:caja/uxc,precio:money(f.precio.value),stock:num(f.stock.value),minimo:num(f.minimo.value)};
    if(f.dataset.id)Object.assign(prod(f.dataset.id),data);else D.productos.push({id:uid(),...data});
    save();closeModal();render();toast('Producto guardado');
  }
  if(k==='cliente'){
    const data={nombre:f.nombre.value.trim(),area:f.area.value.trim(),tel:f.tel.value.trim()};if(!data.nombre)return;
    let id=f.dataset.id;if(id)Object.assign(cli(id),data);else{id=uid();D.clientes.push({id,...data})}
    if(f.dataset.from==='picker'){save();render();modalConfirmFiar(id);return}
    save();closeModal();render();toast('Cliente guardado');
  }
  if(k==='compra'){
    const faltan=D.productos.filter(p=>num(f['c-'+p.id].value)>0&&!(Math.round(num(f['x-'+p.id].value))>0));
    if(faltan.length)return toast(`Pon cuántas unidades trae la caja de ${faltan[0].nombre}`);
    const items=[];D.productos.forEach(p=>{const cj=num(f['c-'+p.id].value),ux=Math.round(num(f['x-'+p.id].value)),vc=money(f['k-'+p.id].value);
      if(ux>0)p.uxc=ux;if(vc>0)p.caja=vc;p.costo=p.uxc?(p.caja||0)/p.uxc:0;
      if(cj>0){const u=cj*p.uxc;items.push({productoId:p.id,nombre:p.nombre,cajas:cj,cant:u,costo:p.costo});p.stock+=u}});
    if(!items.length)return toast('Pon al menos una cantidad');
    D.compras.push({id:uid(),fecha:new Date().toISOString(),items});UI.pedido={};save();closeModal();render();toast('Inventario actualizado');
  }
  if(k==='abono'){
    const cid=f.dataset.id,monto=money(f.monto.value);if(!monto)return toast('Escribe cuánto pagó');
    let fecha=f.fecha.value?new Date(f.fecha.value):new Date();if(isNaN(fecha)||fecha>new Date(Date.now()+6e4))fecha=new Date();
    const p={id:uid(),clienteId:cid,fecha:fecha.toISOString(),monto,medio:(f.querySelector('[name=medio]:checked')||{}).value||'Efectivo',nota:f.nota.value.trim()};
    D.pagos.push(p);save();
    const sal=saldoCliente(cid),c=cli(cid);
    onConfirm=()=>abrirWA(c.tel,textoRecibo(p));
    openModal(`<div class="stack" style="text-align:center"><div class="big-ok">${ic('check',34)}</div><h2>Pago registrado</h2>
      <p><b class="num" style="font-size:28px">${fmt(monto)}</b></p><p class="muted">${esc(c.nombre)} · ${fFechaL(p.fecha)}, ${fHora(p.fecha)} · ${esc(p.medio)}</p>
      <p>${sal>0.5?`Queda debiendo <b class="warn">${fmt(sal)}</b>`:sal<-0.5?`Saldo a favor <b class="pos">${fmt(-sal)}</b>`:'<b class="pos">Quedó a paz y salvo</b>'}</p>
      <div class="actions" style="justify-content:center"><button class="btn ghost" data-a="close">Listo</button><button class="btn primary" data-a="okConfirm">${ic('chat',18)}Enviar comprobante</button></div></div>`);
    render();
  }
  if(k==='ajustes'){D.config.nombre=f.nombre.value.trim()||'La Tiendita';D.config.tema=f.tema.value;save();aplicarTema();closeModal();render();toast('Ajustes guardados')}
});
$('#fileImport').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.productos)||!Array.isArray(x.ventas))throw 0;
    ['clientes','compras'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});x.config=Object.assign({nombre:'La Tiendita',tema:'light'},x.config||{});if(x.config.tema!=='dark')x.config.tema='light';
    if(!Array.isArray(x.pagos))x.pagos=[];D=x;normalizar();save();aplicarTema();closeModal();UI.cart={};UI.pedido={};render();toast('Respaldo cargado')}catch(err){toast('El archivo no es un respaldo válido')}};
  r.readAsText(file);e.target.value='';
});

/* ===================== Datos de ejemplo ===================== */
function demo(){
  const d=vacio();d.config=Object.assign({},D.config);
  const P=[['Torta de queso',60000,24,4000,20,5],['Vaso copa dulce de leche combinado',36000,12,5000,15,4],['Panelita con leche cortada',30000,50,1000,40,10],['Panelita cortada con coco',30000,50,1000,40,10],['Vaso galleta con dulce de leche',30000,12,4000,15,4],['Galleta rizada domo',21000,30,1200,30,8],['Liberales domo',24000,30,1500,30,8]];
  P.forEach(([nombre,caja,uxc,precio,stock,minimo])=>d.productos.push({id:uid(),nombre,caja,uxc,costo:caja/uxc,precio,stock,minimo}));
  ['Carlos Pérez|Taller','Diana Rojas|Compras','Andrés Gómez|Ingeniería','Laura Medina|Comercial','Julián Torres|Almacén','Paola Ruiz|Administración'].forEach(s=>{const[n,a]=s.split('|');d.clientes.push({id:uid(),nombre:n,area:a,tel:''})});
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const qa=quincena(new Date(quincena().ini.getTime()-864e5));
  for(let k=0;k<70;k++){
    const t=new Date(Date.now()-rnd()*30*864e5);t.setHours(7+Math.floor(rnd()*9),Math.floor(rnd()*60));
    const items=[];const n=1+Math.floor(rnd()*2);
    for(let j=0;j<n;j++){const p=d.productos[Math.floor(Math.pow(rnd(),1.4)*d.productos.length)];if(items.some(i=>i.productoId===p.id))continue;items.push({productoId:p.id,nombre:p.nombre,cant:1+Math.floor(rnd()*2),precio:p.precio,costo:p.costo})}
    const c=d.clientes[Math.floor(rnd()*d.clientes.length)];
    if(t>new Date())t.setTime(Date.now()-rnd()*36e5*3);
    d.ventas.push({id:uid(),fecha:t.toISOString(),clienteId:c.id,items,tipo:rnd()<.2?'contado':'fiado'});
  }
  /* pagos en los días de cobro pasados (15 y fin de mes) */
  const dias=[];for(let x=quincena(new Date(Date.now()-40*864e5));x.pago<new Date();x=quincena(new Date(x.fin.getTime()+864e5)))dias.push(x.pago);
  const med=['Efectivo','Nequi','Nequi','Daviplata','Efectivo'];
  dias.forEach(pd=>{const pf=new Date(pd);pf.setHours(12,Math.floor(rnd()*50));if(pf>new Date())return;
    d.clientes.forEach(c=>{let deb=0;d.ventas.forEach(v=>{if(v.clienteId===c.id&&v.tipo==='fiado'&&new Date(v.fecha)<pf)deb+=totV(v)});d.pagos.forEach(p=>{if(p.clienteId===c.id)deb-=p.monto});
      if(deb<=0)return;const r=rnd();const monto=r<.7?deb:r<.9?Math.round(deb/2/1000)*1000:0;
      if(monto>0)d.pagos.push({id:uid(),clienteId:c.id,fecha:new Date(pf.getTime()+rnd()*3*36e5).toISOString(),monto,medio:med[Math.floor(rnd()*med.length)],nota:r<.7?'':'Abono'})})});
  d.productos[1].stock=6;d.productos[4].stock=3;
  return d;
}

let _rw=innerWidth<700;window.addEventListener('resize',()=>{const n=innerWidth<700;if(n!==_rw){_rw=n;if(UI.view==='reportes')render()}});
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{D=JSON.parse(e.newValue);normalizar();render()}catch(err){}});
aplicarTema();render();
</script>
